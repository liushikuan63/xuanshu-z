# 玄枢桌面壳打包配置（electron-builder，Win11 NSIS）
appId: xuanshu.workbench
productName: 玄枢八术
copyright: 玄枢 · 本地优先，数据不出本机
directories:
  output: release
files:
  - src/**/*
  - ../web/dist/**/*
extraMetadata:
  main: src/main.js
win:
  target:
    - nsis
  artifactName: XuanshuEightArtsSetup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 玄枢八术
